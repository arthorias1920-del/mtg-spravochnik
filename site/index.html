<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Справочник по MTG</title>
<meta name="description" content="Колоды из сета The Hobbit с русским переводом карт">
<meta name="theme-color" content="#2f4a33">
<!-- Режим «на весь экран» на iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Справочник">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
<script>
  // Service worker: кэширует все файлы, чтобы приложение работало без интернета
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
